<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
  </defs>
  <!-- Play / Chevron icon -->
  <polygon points="15,20 15,100 95,60" fill="url(#playGrad)"/>
  <!-- V icon -->
  <polygon points="130,20 170,100 210,20" fill="none" stroke="url(#logoGrad)" stroke-width="8" stroke-linejoin="round"/>
  <!-- Text: Vikas -->
  <text x="130" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" fill="#1F2937">Vikas</text>
  <!-- Text: Editing -->
  <text x="235" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="300" fill="#7C3AED">Editing</text>
</svg>
